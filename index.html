<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Personajes de Dragon Ball</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color:#1e1e1e;
            color: white; 
            font-family: sans-serif;
        }

        h1 {
            color: #FFA500; 
            margin-top: 20px;
            margin-bottom: 30px;
        }

        #searchButton {
            background-color: #FFA500;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 0.5rem;
        }

        #searchButton:hover {
            background-color: #FFD700; 
        }

        #characterContainer {
            margin-top: 30px;
        }

        .card {
            background-color: #1e1e1e;
            border: 2px solid #FFD700;
            border-radius: 1rem;
            margin-bottom: 20px; 
        }

        .card img {
            height: 300px;
            object-fit: contain;
        }

        .card-title {
            color: #FFD700; 
            font-weight: bold;
        }

        .card-text {
            color: #f0f0f0;
        }

        .btn-detalle {
            background-color: #FFA500;
            color: black;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-detalle:hover {
            background-color: #FFD700;
        }

        #errorMessage {
            color: #FFA500;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        
        #errorMessage[style*="color: #FFD700"] { 
            color: #FFD700;
        }
        
        #searchInput,
        #searchButton {
            border-radius: 0.5rem;
        }
        
        .modal-content {
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #FFD700;
        }
        
        .modal-header {
            border-bottom: 1px solid #FFD700;
        }
        
        .modal-footer {
            border-top: 1px solid #FFD700;
        }
        
        .btn-close {
            filter: invert(1);
        }
        
        #loadingIndicator {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center">Buscador de Personajes de Dragon Ball</h1>
        <div class="input-group mb-">
            <input type="text" id="searchInput" class="form-control" placeholder="Escribe el nombre del personaje..." aria-label="Nombre del personaje" aria-describedby="searchButton">
            <button class="btn" type="button" id="searchButton">Buscar</button>
        </div>
        <div id="characterContainer" class="row"></div>
        <div id="loadingIndicator">
            <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="text-warning mt-2">Cargando más personajes...</p>
        </div>
    </div>

    <!-- Modal para detalles -->
    <div class="modal fade" id="detallesModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPersonajeNombre"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body row">
                    <div class="col-md-6">
                        <img id="modalPersonajeImagen" src="" class="img-fluid rounded" alt="Imagen del personaje">
                    </div>
                    <div class="col-md-6">
                        <p><strong>Raza:</strong> <span id="modalPersonajeRaza"></span></p>
                        <p><strong>Género:</strong> <span id="modalPersonajeGenero"></span></p>
                        <p><strong>Ki:</strong> <span id="modalPersonajeKi"></span></p>
                        <p><strong>Afiliación:</strong> <span id="modalPersonajeAfiliacion"></span></p>
                        <p><strong>Descripción:</strong> <span id="modalPersonajeDescripcion"></span></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('searchInput');
            const button = document.getElementById('searchButton');
            const container = document.getElementById('characterContainer');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const API_BASE = 'https://dragonball-api.com/api';
            
            // Variables para el scroll infinito
            let currentPage = 1;
            let isLoading = false;
            let isSearching = false;
            let hasMore = true;
            let loadedCharacterIds = new Set(); // Para evitar duplicados
            
            // Elementos del modal
            const detallesModal = new bootstrap.Modal(document.getElementById('detallesModal'));
            const modalNombre = document.getElementById('modalPersonajeNombre');
            const modalImagen = document.getElementById('modalPersonajeImagen');
            const modalRaza = document.getElementById('modalPersonajeRaza');
            const modalGenero = document.getElementById('modalPersonajeGenero');
            const modalKi = document.getElementById('modalPersonajeKi');
            const modalAfiliacion = document.getElementById('modalPersonajeAfiliacion');
            const modalDescripcion = document.getElementById('modalPersonajeDescripcion');

            function limpiarResultados() {
                container.innerHTML = '';
                currentPage = 1;
                hasMore = true;
                loadedCharacterIds.clear(); // Limpiar el conjunto de IDs cargados
            }

            function mostrarMensaje(mensaje, tipo = 'error') {
                limpiarResultados();
                const div = document.createElement('div');
                div.id = 'errorMessage';
                div.textContent = mensaje;
                div.style.color = tipo === 'error' ? '#FFA500' : '#FFD700'; 
                container.appendChild(div);
            }

            function mostrarCargando() {
                loadingIndicator.style.display = 'block';
                isLoading = true;
            }

            function ocultarCargando() {
                loadingIndicator.style.display = 'none';
                isLoading = false;
            }

            async function renderizarPersonaje(personaje) {
                // Verificar si el personaje ya fue cargado
                if (loadedCharacterIds.has(personaje.id)) {
                    return false; // No renderizar duplicados
                }
                
                loadedCharacterIds.add(personaje.id); // Registrar ID cargado
                
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-4';

                const card = document.createElement('div');
                card.className = 'card h-100';

                const imagen = document.createElement('img');
                imagen.src = personaje.image || 'https://via.placeholder.com/300x400?text=Imagen+no+disponible';
                imagen.className = 'card-img-top';
                imagen.alt = personaje.name;

                const body = document.createElement('div');
                body.className = 'card-body d-flex flex-column';

                const nombre = document.createElement('h5');
                nombre.className = 'card-title';
                nombre.textContent = personaje.name;

                const raza = document.createElement('p');
                raza.className = 'card-text';
                raza.textContent = `Raza: ${personaje.race || 'Desconocida'}`;

                const genero = document.createElement('p');
                genero.className = 'card-text';
                genero.textContent = `Género: ${personaje.gender || 'Desconocido'}`;

                const btnDetalle = document.createElement('button');
                btnDetalle.className = 'btn btn-detalle mt-auto';
                btnDetalle.textContent = 'Ver detalles';
                btnDetalle.dataset.id = personaje.id;
                
                body.appendChild(nombre);
                body.appendChild(raza);
                body.appendChild(genero);
                body.appendChild(btnDetalle);
                card.appendChild(imagen);
                card.appendChild(body);
                col.appendChild(card);
                container.appendChild(col);

                // Evento para el botón de detalles
                btnDetalle.addEventListener('click', async () => {
                    try {
                        const response = await fetch(`${API_BASE}/characters/${personaje.id}`);
                        const detalles = await response.json();
                        mostrarModalDetalles(detalles);
                    } catch (error) {
                        console.error('Error al obtener detalles:', error);
                        mostrarMensaje('Error al cargar los detalles del personaje');
                    }
                });
                
                return true; // Personaje renderizado
            }

            function mostrarModalDetalles(personaje) {
                modalNombre.textContent = personaje.name;
                modalImagen.src = personaje.image || 'https://via.placeholder.com/300x400?text=Imagen+no+disponible';
                modalRaza.textContent = personaje.race || 'Desconocida';
                modalGenero.textContent = personaje.gender || 'Desconocido';
                modalKi.textContent = personaje.ki || 'Desconocido';
                modalAfiliacion.textContent = personaje.affiliation || 'Desconocida';
                modalDescripcion.textContent = personaje.description || 'Descripción no disponible';
                
                detallesModal.show();
            }

            async function cargarMasPersonajes() {
                if (isLoading || !hasMore || isSearching) return;
                
                mostrarCargando();
                currentPage++;
                
                try {
                    const response = await fetch(`${API_BASE}/characters?page=${currentPage}`);
                    const data = await response.json();

                    if (data && data.items && data.items.length > 0) {
                        let newCharactersAdded = false;
                        
                        for (const personaje of data.items) {
                            const wasAdded = await renderizarPersonaje(personaje);
                            if (wasAdded) {
                                newCharactersAdded = true;
                            }
                        }
                        
                        // Si no se agregaron nuevos personajes, intentar con la siguiente página
                        if (!newCharactersAdded && currentPage < 10) { // Límite de 10 páginas para evitar bucles infinitos
                            await cargarMasPersonajes();
                        } else if (!newCharactersAdded) {
                            hasMore = false;
                        }
                    } else {
                        hasMore = false;
                    }
                } catch (error) {
                    console.error('Error al cargar más personajes:', error);
                } finally {
                    ocultarCargando();
                }
            }

            async function obtenerPersonajesIniciales() {
                mostrarCargando();
                isSearching = false;
                
                try {
                    const response = await fetch(`${API_BASE}/characters?page=1`);
                    const data = await response.json();

                    if (data && data.items && data.items.length > 0) {
                        limpiarResultados();
                        for (const personaje of data.items) {
                            await renderizarPersonaje(personaje);
                        }
                    } else {
                        mostrarMensaje('No se encontraron personajes.', 'info');
                    }
                } catch (error) {
                    mostrarMensaje('Error al cargar personajes iniciales');
                    console.error(error);
                } finally {
                    ocultarCargando();
                }
            }

            async function buscarPersonaje() {
                const nombre = input.value.trim();
                
                if (!nombre) {
                    obtenerPersonajesIniciales();
                    return;
                }

                mostrarCargando();
                limpiarResultados();
                isSearching = true;
                hasMore = false; // No cargar más en búsquedas
                
                try {
                    const response = await fetch(`${API_BASE}/characters?name=${nombre}`);
                    const data = await response.json();

                    if (data && data.length > 0) {
                        for (const personaje of data) {
                            await renderizarPersonaje(personaje);
                        }
                    } else {
                        mostrarMensaje('No se encontraron personajes con ese nombre', 'info');
                    }
                } catch (error) {
                    mostrarMensaje('Error al buscar personajes');
                    console.error(error);
                } finally {
                    ocultarCargando();
                }
            }

            // Evento de scroll infinito
            window.addEventListener('scroll', () => {
                const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
                
                if (scrollTop + clientHeight >= scrollHeight - 100 && !isLoading) {
                    cargarMasPersonajes();
                }
            });

            // Event listeners
            button.addEventListener('click', buscarPersonaje);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') buscarPersonaje();
            });

            // Initial load of characters
            obtenerPersonajesIniciales();
        });
    </script>
</body>
</html>
